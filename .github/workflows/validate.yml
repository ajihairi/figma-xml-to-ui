name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libxml2
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: XML well-formedness
        run: |
          for f in examples/*.xml; do
            xmllint --noout "$f"
            echo "ok $f"
          done

      - name: Skill package
        run: python3 scripts/check-skill.py

      - name: Fixtures, geometry, preview coverage
        run: python3 scripts/check-examples.py

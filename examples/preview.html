<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>Login / Screen — reference render</title>
<!--
  Reference render of examples/sample-login.xml.
  Purpose: pixel reference for comparing generated UI against the source frame.
  Rule: every value here is copied 1:1 from the XML — do not "improve" this file,
  change the XML instead, then regenerate preview.png:
      "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
        --headless=new --hide-scrollbars \
        --window-size=375,812 --force-device-scale-factor=2 \
        --default-background-color=00000000 \
        --screenshot=examples/preview.png \
        "file://$PWD/examples/preview.html"
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 375px; height: 812px; overflow: hidden;
    display: flex; flex-direction: column;
    gap: 28px;
    padding: 56px 24px 32px;
    background: #FAFAFA;
    color: #18181B;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .row { display: flex; }
  .col { display: flex; flex-direction: column; }
  .nav { height: 24px; align-items: center; justify-content: space-between; }
  .nav .icon { width: 24px; height: 24px; }
  .nav .spacer-24 { width: 24px; height: 24px; }

  .header { gap: 8px; align-items: flex-start; }
  .h1 {
    margin: 0; font-size: 28px; line-height: 36px; font-weight: 700;
    letter-spacing: -0.5px; color: #18181B;
  }
  .sub {
    margin: 0; font-size: 15px; line-height: 22px; font-weight: 400;
    letter-spacing: 0; color: #71717A;
  }

  .form { gap: 16px; align-items: stretch; }
  .field {
    height: 52px; display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; border: 1px solid #E4E4E7; border-radius: 12px;
    background: #FFFFFF;
  }
  .field .icon { width: 20px; height: 20px; flex: none; color: #71717A; }
  .field .value {
    flex: 1 1 auto; font-size: 15px; line-height: 22px; font-weight: 400;
    color: #18181B; white-space: nowrap;
  }
  .field .value.placeholder { color: #A1A1AA; }
  .field .value.masked { letter-spacing: 2px; }
  .forgot {
    margin: 0; font-size: 13px; line-height: 20px; font-weight: 600;
    text-align: right; color: #18181B; align-self: stretch;
  }

  .cta {
    height: 52px; display: flex; align-items: center; justify-content: center;
    padding: 14px 16px; border: 0; border-radius: 12px; background: #18181B;
    box-shadow: 0 8px 24px 0 rgba(24, 24, 27, 0.18);
    font: 600 16px/24px inherit; letter-spacing: 0; color: #FAFAFA;
    cursor: pointer;
  }

  .divider { height: 20px; align-items: center; justify-content: center; gap: 12px; }
  .divider .rule { flex: 1 1 0%; height: 1px; background: #E4E4E7; }
  .divider .label {
    margin: 0; font-size: 13px; line-height: 20px; font-weight: 400;
    letter-spacing: 0; color: #71717A; white-space: nowrap;
  }

  .social { gap: 12px; }
  .social-btn {
    flex: 1 1 0%; height: 52px; display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 14px 12px;
    border: 1px solid #E4E4E7; border-radius: 12px; background: #FFFFFF;
    font: 600 15px/22px inherit; letter-spacing: 0; color: #18181B; cursor: pointer;
  }
  .social-btn .icon { width: 20px; height: 20px; flex: none; }

  .flex-spacer { flex: 1 1 0%; }

  .footer { height: 20px; align-items: center; justify-content: center; gap: 4px; }
  .footer .prompt {
    margin: 0; font-size: 13px; line-height: 20px; font-weight: 400;
    letter-spacing: 0; color: #71717A;
  }
  .footer .link {
    margin: 0; font-size: 13px; line-height: 20px; font-weight: 600;
    letter-spacing: 0; color: #18181B; cursor: pointer;
  }
</style>
</head>
<body>

  <!-- 1:2 Nav Bar -->
  <div class="row nav">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
    </svg>
    <p class="h1" style="font-size:16px;line-height:24px;font-weight:600;letter-spacing:0;text-align:center;color:#18181B;margin:0;">Sign In</p>
    <div class="spacer-24"></div>
  </div>

  <!-- 1:7 Header -->
  <div class="col header">
    <p class="h1">Welcome back</p>
    <p class="sub">Sign in to keep your streak alive.</p>
  </div>

  <!-- 1:10 Form -->
  <div class="col form">
    <div class="field">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
      </svg>
      <span class="value placeholder">you@example.com</span>
    </div>

    <div class="field">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <span class="value masked">••••••••</span>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
      </svg>
    </div>

    <p class="forgot">Forgot password?</p>
  </div>

  <!-- 1:22 Button / Primary -->
  <button type="button" class="cta">Sign in</button>

  <!-- 1:24 Divider -->
  <div class="row divider">
    <div class="rule"></div>
    <p class="label">or continue with</p>
    <div class="rule"></div>
  </div>

  <!-- 1:28 Social Row -->
  <div class="row social">
    <button type="button" class="social-btn">
      <svg class="icon" viewBox="0 0 24 24" fill="#18181B" aria-hidden="true">
        <path d="M12.24 10.285V14.4h6.806c-.275 1.765-2.056 5.174-6.806 5.174-4.095 0-7.439-3.389-7.439-7.574s3.344-7.574 7.439-7.574c2.33 0 3.891.989 4.785 1.849l3.254-3.138C18.189 1.186 15.479 0 12.24 0c-6.635 0-12 5.365-12 12s5.365 12 12 12c6.926 0 11.52-4.869 11.52-11.726 0-.788-.085-1.39-.189-1.989H12.24Z"/>
      </svg>
      <span>Google</span>
    </button>
    <button type="button" class="social-btn">
      <svg class="icon" viewBox="0 0 24 24" fill="#18181B" aria-hidden="true">
        <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.08ZM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25Z"/>
      </svg>
      <span>Apple</span>
    </button>
  </div>

  <!-- 1:40 Spacer -->
  <div class="flex-spacer"></div>

  <!-- 1:37 Footer -->
  <div class="row footer">
    <p class="prompt">Don't have an account?</p>
    <p class="link">Sign up</p>
  </div>

</body>
</html>
